<!-- templates/meal_records.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>당일 석식 현황</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6 bg-gray-100">
  <h2 class="text-2xl mb-4">{{ month }}월 {{ day }}일 석식 현황</h2>
  <table class="min-w-full bg-white rounded shadow">
    <thead class="bg-gray-200">
      <tr>
        <th class="px-4 py-2">학년</th>
        <th class="px-4 py-2">반</th>
        <th class="px-4 py-2">번호</th>
        <th class="px-4 py-2">이름</th>
        <th class="px-4 py-2">신청여부</th>
        <th class="px-4 py-2">수령</th>
      </tr>
    </thead>
    <tbody>
      {% for r in records %}
        <tr class="border-b">
          <td class="px-4 py-2">{{ r.unique_code.grade }}학년</td>
          <td class="px-4 py-2">{{ r.unique_code.class_ }}반</td>
          <td class="px-4 py-2">{{ r.unique_code.number }}번</td>
          <td class="px-4 py-2">{{ r.unique_code.name }}</td>
          <td class="px-4 py-2">{{ r.unique_code.booking_flag }}</td>
          <td class="px-4 py-2">
            {% if r.received %}O{% else %}X{% endif %}
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
