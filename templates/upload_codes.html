<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>고유코드 업로드</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <form action="{{ url_for('upload_codes') }}" method="post" enctype="multipart/form-data"
        class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">고유코드 CSV 업로드</h2>

    {% with messages = get_flashed_messages() %}
     {% if messages %}
       <div class="mb-4 px-4 py-2 bg-red-100 text-red-800 rounded">
         {{ messages[0] }}
       </div>
     {% endif %}
   {% endwith %}

    <input type="file" name="file" accept=".csv"
           class="w-full mb-4 text-base text-gray-700"/>
    <input type="submit" value="업로드"
           class="w-full bg-blue-600 text-white text-lg py-3 rounded-2xl font-bold hover:bg-blue-500 transition"/>

    <p class="mt-4 text-center">
      <a href="{{ url_for('admin_dashboard') }}" class="text-blue-600 hover:underline">대시보드로 돌아가기</a>
    </p>
  </form>

</body>
</html>
