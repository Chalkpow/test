<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>사용자 정보 수정</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <form action="{{ url_for('edit_user', user_id=user.id) }}" method="post" class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">사용자 정보 수정</h2>

    <div class="flex gap-3 mb-4">
      <div class="flex-1">
        <label for="grade" class="block text-sm font-medium text-gray-700 mb-1">학년</label>
        <select id="grade" name="grade" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-base">
          <option value="1" {% if user.grade == '01' %}selected{% endif %}>1학년</option>
          <option value="2" {% if user.grade == '02' %}selected{% endif %}>2학년</option>
          <option value="3" {% if user.grade == '03' %}selected{% endif %}>3학년</option>
        </select>
      </div>

      <div class="flex-1">
        <label for="class" class="block text-sm font-medium text-gray-700 mb-1">반</label>
        <select id="class" name="class" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-base">
          {% for i in range(1, 7) %}
            <option value="{{ i }}" {% if user.class_ == '%02d'|format(i) %}selected{% endif %}>{{ i }}반</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex-1">
        <label for="number" class="block text-sm font-medium text-gray-700 mb-1">번호</label>
        <select id="number" name="number" required
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-base">
          {% for i in range(1, 31) %}
            <option value="{{ i }}" {% if user.number == '%02d'|format(i) %}selected{% endif %}>{{ i }}번</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <label for="name" class="block text-sm font-medium text-gray-700 mb-1">이름</label>
    <input type="text" id="name" name="name" value="{{ user.name }}" required
      class="w-full mb-4 rounded-lg border border-gray-300 px-4 py-2 text-base" />

    <label for="userid" class="block text-sm font-medium text-gray-700 mb-1">아이디</label>
    <input type="text" id="userid" name="userid" value="{{ user.userid }}" required
      class="w-full mb-4 rounded-lg border border-gray-300 px-4 py-2 text-base" />

    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">새 비밀번호 (변경 시에만 입력)</label>
    <input type="password" id="password" name="password"
      class="w-full mb-4 rounded-lg border border-gray-300 px-4 py-2 text-base" />

    <div class="flex items-center mb-1">
      <label for="password_confirm" class="block text-sm font-medium text-gray-700">새 비밀번호 확인</label>
      <span id="password_match_msg" class="ml-3 text-sm font-semibold"></span>
    </div>
    <input type="password" id="password_confirm" name="password_confirm"
      class="w-full mb-6 rounded-lg border border-gray-300 px-4 py-2 text-base" />

    <input type="submit" value="정보 수정"
      class="w-full bg-blue-600 text-white text-lg py-3 rounded-2xl font-bold hover:bg-blue-500 transition cursor-pointer" />
    <a href="{{ url_for('admin_dashboard') }}" class="block text-center mt-4 text-blue-600 hover:underline">취소하고 목록으로 돌아가기</a>
  </form>

  <script>
    const passwordInput = document.getElementById('password');
    const passwordConfirmInput = document.getElementById('password_confirm');
    const msgSpan = document.getElementById('password_match_msg');

    function checkPasswordMatch() {
      const pwd = passwordInput.value;
      const confirm = passwordConfirmInput.value;

      if (confirm === "") {
        msgSpan.textContent = "";
        msgSpan.classList.remove('text-green-600', 'text-red-600');
        return;
      }

      if (pwd === confirm) {
        msgSpan.textContent = "일치합니다";
        msgSpan.classList.remove('text-red-600');
        msgSpan.classList.add('text-green-600');
      } else {
        msgSpan.textContent = "일치하지 않습니다";
        msgSpan.classList.remove('text-green-600');
        msgSpan.classList.add('text-red-600');
      }
    }

    passwordInput.addEventListener('input', checkPasswordMatch);
    passwordConfirmInput.addEventListener('input', checkPasswordMatch);
  </script>

</body>
</html>
