<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>고유코드 수정</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

  <form action="{{ url_for('edit_code', code_id=code.id) }}" method="post"
        class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">고유코드 수정</h2>

    <label for="code" class="block text-sm font-medium text-gray-700 mb-1">코드</label>
    <input type="text" id="code" name="code" value="{{ code.code }}" required
           class="w-full mb-6 rounded-lg border border-gray-300 px-4 py-2 text-base" />

    <input type="submit" value="저장"
           class="w-full bg-blue-600 text-white text-lg py-3 rounded-2xl font-bold hover:bg-blue-500 transition"/>
    <p class="mt-4 text-center">
      <a href="{{ url_for('view_codes') }}" class="text-blue-600 hover:underline">목록으로 돌아가기</a>
    </p>
  </form>

</body>
</html>
